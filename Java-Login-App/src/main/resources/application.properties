spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# Database connection injected via environment variables / secrets manager.
# Local fallback defaults (override with SPRING_DATASOURCE_* env vars or -D args).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/UserDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeit}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
