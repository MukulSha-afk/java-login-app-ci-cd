# ---- Application ----
spring.application.name=dptweb
server.port=${SERVER_PORT:8080}

# Never expose stack traces or internal messages in HTTP error responses
# (failures are logged server-side only, see GlobalExceptionHandler).
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Datasource (override via environment - no secrets in this file) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/UserDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# The schema is initialized by docker-entrypoint-initdb.d (or manually with
# schema.sql); the application itself never runs DDL on an existing database.
spring.sql.init.mode=never

# ---- JSP view resolution ----
spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# ---- Session / cookie hardening ----
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
# Set SESSION_COOKIE_SECURE=true when serving over HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.name=REQUESTCASCADE_SESSION

# ---- Login throttling (see LoginAttemptService) ----
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# ---- Logging ----
logging.level.com.dpt.demo=INFO
