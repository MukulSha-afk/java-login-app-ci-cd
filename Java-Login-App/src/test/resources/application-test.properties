# Test profile: isolated in-memory H2 (MySQL compatibility mode).
# Tests NEVER touch the production MySQL instance; data lives only for the JVM
# lifetime of the test run (DB_CLOSE_DELAY=-1) and is re-created/cleaned per test.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=4

# Recreate the schema from the test DDL on every test context start.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql

# Keep test output focused on test results.
logging.level.com.dpt.demo=WARN
logging.level.org.springframework=WARN
